#blk{position:fixed;inset:0;background:#000;z-index:300;display:none}

/* CSS Teclado Módulo */
.kw.dk{--kb:#26282b;--kt:#fff;--kd:#0b0c0d;--tr:#101113}
.kv{position:relative;width:100%;padding-top:3.6em}.kv.s{padding-top:2.4em}
.kbd{display:grid;grid-template-columns:repeat(120,minmax(0,1fr));grid-template-rows:1.9em repeat(5,2.9em);gap:0;background:var(--tr);padding:.3em;border-radius:.6em;user-select:none;width:100%;font-size:1em}
.kv.s .kbd{font-size:.52em}
.k{background:var(--kb);color:var(--kt);border:.14em solid var(--kd);border-bottom-width:.25em;border-radius:.35em;margin:.14em;display:flex;align-items:center;justify-content:center;position:relative;font-weight:700;font-size:1.05em;white-space:nowrap;overflow:hidden;min-width:0}
.k.t b{transform:translateY(.28em)}.k.tx b{font-size:.8em}.k.en{grid-row:span 2}
.k i{position:absolute;left:.3em;top:.05em;font-size:.7em;font-style:normal;font-weight:600;opacity:.85}
.k s{position:absolute;right:.2em;bottom:0;font-size:.5em;text-decoration:none;color:#2b79c2}
.k em{font-style:normal}
.kv.s .k i,.kv.s .k s,.kv.s .lg{display:none}.kv.s .k.t b{transform:none}
.hl-key{background:#3b82f6!important;color:#fff!important;border-color:#1d4ed8!important;transform:translateY(2px)}
.nx{background:#22c55e!important;color:#fff!important;border-color:#15803d!important}
.gd{background:#facc15!important;color:#222!important;border-color:#b45309!important;animation:kb .6s infinite}
.bad{background:#ef4444!important;color:#fff!important;border-color:#991b1b!important}
.dn{background:#86efac!important;color:#14532d!important;transform:translateY(2px)}
@keyframes kb{50%{background:#f97316;transform:translateY(3px)}}
.bd{position:absolute;display:flex;flex-direction:column;align-items:center;background:#fff;color:#1f2937;border:2px solid #2b79c2;border-radius:.6em;padding:.1em .45em;font-weight:800;font-size:.8em;line-height:1.1;box-shadow:0 2px 6px #0005;opacity:0;transform:translate(-50%,-85%);transition:opacity .35s,transform .35s;z-index:3;white-space:nowrap;pointer-events:none}
.bd.show{opacity:1;transform:translate(-50%,-100%)}.bd span{font-size:1.7em}.bd.tap{border-color:#d97706}.bd.tap.show span{animation:tp .7s infinite}
@keyframes tp{50%{transform:translateY(.25em)}}
.kv.s .bd{font-size:.5em;border-width:1px}
svg.arc-line{position:absolute;left:0;top:0;pointer-events:none;z-index:2;overflow:visible}
</style>
</head>

<script>
/* 🔒 COMPATIBILIDAD GITHUB PAGES — NO MODIFICAR: navegación al index y guardado local del alumno/progreso dependen de esta sección. */
/* ===== INICIO MÓDULO ALUMNO v1 =====
   Identidad del alumno + preferencias + navegación al inicio.
   USO: pegar este bloque DENTRO de un <script> de la app, ANTES del código propio
        (y antes de progreso.js). No se carga como archivo aparte: cada app sigue
        siendo un único HTML.
   Globales que crea: MJ_INDEX, Alumno  (no usar esos nombres en la app).
   API:
     Alumno.get()            -> {nombre,curso,id,creado} o null
     Alumno.nombre()         -> nombre completo o ''
     Alumno.set({nombre,curso}) -> guarda y devuelve el alumno (null si el nombre es muy corto)
     Alumno.limpiar()        -> "este no soy yo": borra al alumno (NO borra su progreso)
     Alumno.pedir(cb)        -> si ya hay alumno llama cb(alumno); si no, muestra una
                                pantalla de nombre (solo pasa si abrieron la app suelta)
     Alumno.prefs()          -> {fs,voz,snd,kbDark}   (con valores por defecto)
     Alumno.setPref(k,v)     -> guarda una preferencia
     Alumno.irInicio()       -> vuelve al index
     Alumno.botonInicio(el)  -> agrega el botón "🏠 Inicio" dentro de el (o fijo arriba a la derecha)
   Almacenamiento: localStorage con prefijo "mj:"; si no está disponible (modo privado,
   algunos file://) usa memoria y la app sigue funcionando durante esa sesión.
   ===================================================================== */
const MJ_INDEX='../../index.html'; /* ← ruta RELATIVA al index desde esta app */
const Alumno=(()=>{
 const mem={},ls=(()=>{try{localStorage.setItem('mj:t',1);localStorage.removeItem('mj:t');return localStorage}catch(e){return null}})();
 const leer=k=>{try{const v=ls?ls.getItem('mj:'+k):mem[k];return v==null?null:JSON.parse(v)}catch(e){return null}};
 const guardar=(k,v)=>{try{const s=JSON.stringify(v);if(ls)ls.setItem('mj:'+k,s);else mem[k]=s;return true}catch(e){return false}};
 const borrar=k=>{try{if(ls)ls.removeItem('mj:'+k);else delete mem[k]}catch(e){}};
 const limpio=s=>String(s==null?'':s).replace(/[<>&"'`\\\/]/g,'').replace(/\s+/g,' ').trim().slice(0,40);
 const slug=s=>limpio(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');
 const get=()=>{const a=leer('alumno');return a&&a.id?a:null};
 const set=d=>{d=d||{};const nombre=limpio(d.nombre),curso=limpio(d.curso);if(nombre.length<2)return null;
  const a={nombre,curso,id:slug(nombre)+(curso?'_'+slug(curso):''),creado:new Date().toISOString()};guardar('alumno',a);return a};
 const DEF={fs:16,voz:true,snd:true,kbDark:false};
 const prefs=()=>{const p=leer('prefs')||{},o={};for(const k in DEF)o[k]=k in p?p[k]:DEF[k];return o};
 const setPref=(k,v)=>{if(!(k in DEF))return;const p=prefs();p[k]=v;guardar('prefs',p)};
 const irInicio=()=>{location.href=MJ_INDEX};
 const botonInicio=el=>{const b=document.createElement('button');b.textContent='🏠 Inicio';b.title='Volver al inicio';b.onclick=irInicio;
  b.style.cssText=el?'background:#374151;color:#fff;border:0;border-radius:.3em;padding:.15em .6em;cursor:pointer;font:inherit'
   :'position:fixed;top:.4em;right:.4em;z-index:9998;background:#374151;color:#fff;border:0;border-radius:.4em;padding:.3em .7em;cursor:pointer;font:inherit';
  if(el)el.insertBefore(b,el.firstChild);else document.body.appendChild(b);return b};
 function pedir(cb){const a=get();if(a){cb(a);return}
  const d=document.createElement('div'),ci='font:inherit;font-size:1.2em;padding:.4em;border-radius:.4em;border:0;text-align:center;width:min(20em,90%);color:#222';

let forcedArrowTarget = null;
let forcedArrowDir = 'down';

function setArrow(elOrRect, dir='down'){
  forcedArrowTarget = elOrRect;
  forcedArrowDir = dir;
  updateArrowPos();
}

function updateArrowPos(){
  const arr = $('#ptr-arrow');
  if(!forcedArrowTarget){ arr.style.display='none'; return; }
  
  let target = typeof forcedArrowTarget==='function' ? forcedArrowTarget() : forcedArrowTarget;
  if(typeof target === 'string') target = $(target);
  if(!target){ arr.style.display='none'; return; }
  
  const r = (target instanceof Element) ? target.getBoundingClientRect() : target;
  if(!r || (r.width===0 && r.height===0)){ arr.style.display='none'; return; }
  
  arr.style.display = 'block';
  let t=0, l=0, deg=0, ax=0, ay=-10;
  
  if(forcedArrowDir==='down'){
    deg = 0;
    t = r.top - 46;
    l = r.left + r.width/2 - 20;
    ax = 0; ay = -12;
  } else if(forcedArrowDir==='up'){
    deg = 180;
    t = r.bottom + 8;
    l = r.left + r.width/2 - 20;
    ax = 0; ay = 12;
  } else if(forcedArrowDir==='right'){
    deg = 270;
    t = r.top + r.height/2 - 20;
    l = r.left - 48;
    ax = -12; ay = 0;
  } else if(forcedArrowDir==='left'){
    deg = 90;
    t = r.top + r.height/2 - 20;
    l = r.right + 8;
    ax = 12; ay = 0;
  }
  
  arr.style.top = Math.max(10, Math.min(window.innerHeight - 52, t)) + 'px';
  arr.style.left = Math.max(10, Math.min(window.innerWidth - 52, l)) + 'px';
  arr.querySelector('svg').style.transform = `rotate(${deg}deg)`;
  arr.style.setProperty('--ax', ax + 'px');
  arr.style.setProperty('--ay', ay + 'px');
}

/* Helper para obtener la posición exacta del cursor en el texto */
function getCaretRect(el, atEnd=false){
  if(!el) return null;
  try{
    const r=document.createRange();
    r.selectNodeContents(el);
    r.collapse(!atEnd);
    const rects=r.getClientRects();
    if(rects.length>0){
      const rc=rects[0];
      return { top: rc.top, bottom: rc.bottom, left: rc.left, right: rc.right, width: 4, height: rc.height || 20 };
    }
  }catch(x){}
  return el.getBoundingClientRect();
}

function keys(s){
  $('#gp').style.display=s.p?'flex':'none';$('#pads').style.display=s.p?'flex':'none';
}
function show(){
  const s=S.steps[S.step];if(!s)return;S.nx=false;
  $$('.hl').forEach(x=>x.classList.remove('hl'));
  
  if(s.arr) setArrow(s.arr, s.arrDir||'down');
  else setArrow(null);
  
  if(s.o) s.o();
  say(typeof s.t=='function'?s.t():s.t, s.n);
  const on=(a,v)=>a.forEach(x=>$(x).classList.toggle('on',v));
  on(['#pl','#ml'],s.p=='L');on(['#pr','#mr'],s.p=='R');keys(s);
  $('#gl').textContent=s.p=='L'?'Clic IZQUIERDO: botón izquierdo del touchpad o mouse':s.p=='R'?'Clic DERECHO: botón derecho':''
}

setInterval(()=>{
  const s=S.steps[S.step], r=$('#ring');
  if(!s||S.hold){ r.style.display='none'; if(!s) setArrow(null); return; }
  
  let dn=0; try{dn=s.d()}catch(x){}
  if(dn){
    ok();
    const nx=()=>{
      if(S.steps[S.step]!==s)return;S.hold=0;
      if(++S.step>=S.steps.length){
        S.steps=[];$('#gp').style.display=r.style.display='none';
        setArrow(null);
        S.onEnd&&S.onEnd();
      }else show();
    };
    if(s.n)nx();else{S.hold=1;r.style.display='none';setArrow(null);if(s.ok)say(s.ok);setTimeout(nx,s.w||1400)}
    return;
  }
  
  const e=rf(s), b=e&&e.getBoundingClientRect();
  if(!b||!b.width||s.noRing){
    r.style.display='none';
  } else {
    const w=b.width>b.height*2.5, d=w?b.height+26:Math.min(Math.max(b.width,b.height)+20,120), x=w?b.left+Math.min(b.width/2,60):b.left+b.width/2;
    Object.assign(r.style,{display:'block',width:d+'px',height:d+'px',left:x-d/2+'px',top:b.top+b.height/2-d/2+'px'});
  }
  
  if(!s.arr && !forcedArrowTarget){
    if(s.r && !s.n){
      setArrow(s.r, s.arrDir||'down');
    } else {
      const highlighted = $('.hl');
      if(highlighted) setArrow(highlighted, s.arrDir||'down');
    }
  }
  updateArrowPos();
},120);

function hp(){S.steps[S.step]?show():say('Abrí el <b>Menú Principal</b> y elegí una actividad 📋')}

/* Limpieza y navegación */
const stage=h=>$('#stage').innerHTML=h;

}
function prog(){

  $('#pf').style.width=S.done.size/t*100+'%';
  $('#pt').textContent=S.done.size+' de '+t+' actividades';
}
function dk(){
  $('#acts').innerHTML=BL.map(([h,a,b])=>`<div class=ab><small>${h}</small>${Array.from({length:b-a+1},(_,i)=>a+i).map(n=>`<div class="ico act" onclick="go(${n})"><b>${A[n].i}</b>${n}. ${A[n].t}${S.done.has(n)?' ✅':''}</div>`).join('')}</div>`).join('');
}
function menu(q){
  clearTimeout(S.tm);$('#cn').style.display='none';clean();$('#fin').style.display=$('#menu').style.display='none';
  dk();$('#acts').style.display='';
  if(!q)say('¡Hola {n}! Soy ManuBot. Hacé clic en una actividad para practicar.');
}
function go(n){
  S.curAct = n; S.errores = 0; S.actStartTime = Date.now();
  clearTimeout(S.tm);clean();$('#menu').style.display='none';$('#cn').style.display='';$('#acts').style.display='none';
  A[n].f();
}

function fin(n,m=''){
  S.done.add(n);prog();$('#cn').style.display='none';
  $('#mp').style.display='none';
  
  // Contrato v1: Guardar en Progreso
  const actId = 'a0' + n;
  const seg = Math.round((Date.now() - (S.actStartTime || Date.now())) / 1000);
  const estrellas = S.errores === 0 ? 3 : (S.errores <= 2 ? 2 : 1);
  Progreso.registrar(APP_ID, actId, {
    estado: 'hecha',
    estrellas: estrellas,
    errores: S.errores,
    seg: seg
  });

  S.tm=setTimeout(()=>{
    clean();say('¡Excelente {n}! Actividad '+n+' completada. '+m);
    S.tm=setTimeout(()=>{
      if(S.done.size >= Object.keys(A).length) fin8();
      else menu(1);
    },1200);
  },1000);
}

function rs(){
  if(S.rc){
    S.rc=0; reset();
  } else {
    S.rc=1;
    say('Para reiniciar todo, presioná <b>otra vez</b> el botón Reiniciar Todo.');
    setTimeout(()=>S.rc=0, 4000);
  }
}

function reset(){
  clearTimeout(S.tm);
  $('#cn').style.display='none';

  $('#menu').style.display=$('#fin').style.display='none';

}

  if(r&&!s.x&&!r.contains(e.target)&&!e.target.closest('#top,#side,#menu')){
    bad();

addEventListener('mousemove',e=>{

addEventListener('keydown', e=>{
  if(/^(Space|Tab|Backspace|Arrow|Delete|Enter)/.test(e.code) && !e.target.matches('textarea,input,[contenteditable]')) {
    e.preventDefault();
  }
  if(e.repeat) return;
  HELD.add(e.code);
  KBS.forEach(k=>{ k.down(e.code,1); k.key(e.code,1,e); });
  
  const M={Control:'ctrl',Shift:'shift',ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down',Home:'home',End:'end',Backspace:'back',Enter:'enter',Delete:'delete'};
  const c = M[e.key] || e.code.replace('Key','').toLowerCase();
  if(S.kd && S.kd(e, c)) {
    e.preventDefault();
  }
});

addEventListener('keyup', e=>{
  HELD.delete(e.code);
  KBS.forEach(k=>{ k.down(e.code,0); k.key(e.code,0); });
});

addEventListener('dblclick',()=>clearTimeout(S.dt),true);

/* Helper de guía en el teclado virtual */
function guiaTeclaParaCaracter(ch){
  if(!globalKB || !ch) return;
  if(ch === ' '){
    globalKB.set({ h: [], t: 'Space', a: [] });
  } else if(ch === ','){
    globalKB.set({ h: [], t: 'Comma', a: [] });
  } else if(ch === '.'){
    globalKB.set({ h: [], t: 'Period', a: [] });
  } else if(ch >= 'A' && ch <= 'Z'){
    globalKB.set({ h: ['ShiftRight'], t: 'Key' + ch, a: [] });
  } else if(ch >= 'a' && ch <= 'z'){
    globalKB.set({ h: [], t: 'Key' + ch.toUpperCase(), a: [] });
  }
}

2:{t:'El Puntero, el Touchpad y los Clics',i:'🖱️',f(){
 F.o=0; F.cl=0;
 stage(`<div class=win style="inset:1.5em 18em 1.5em 2em"><div class=tt>🖱️ Práctica del puntero</div><div id=pa style="position:relative;flex:1;background:#f3f6fb"></div></div>`);

 function colocarZonaDistante(num){
   $('.target-zone')?.remove();
   const z=document.createElement('div');
   z.className='target-zone';
   z.id='z'+num;
   
   if(num===1){
     z.innerHTML='Zona 1 de 3<br>Llevá el puntero aquí ↗';

3:{t:'Teclado y Escritura (Bloc de notas)',i:'⌨️',f(){
 const TX = "Este es el bloc de notas, sirve para escribir textos simples y luego guardarlos.";
 let i=0, wc='', L=0;
 
 const draw=()=>{
   const ed=$('#ed');if(!ed)return;
   const escrito = esc(TX.slice(0,i));
   const error = wc ? `<span class="wr">${esc(wc===' '?'_':wc)}</span>` : '';
   const cursor = `<span id="cur"></span>`;
   const pendiente = `<span class="gh">${esc(TX.slice(i))}</span>`;
   ed.innerHTML = escrito + error + cursor + pendiente;
   
   const cur = $('#cur');
   if(cur && !wc) setArrow(cur, 'down');
   $('#wc').textContent = `Caracteres: ${i} de ${TX.length}`;
 };
 
 F.np=()=>{
   if($('#np')) return;
   stage(`<div class=win id=np style="inset:1.5em 18em 1.5em 2em"><div class=tt>📝 Sin título - Bloc de notas</div>
          <div style="background:#f3f3f3;padding:.2em .6em;font-size:.9em;border-bottom:1px solid #ccc">Archivo &nbsp; Edición &nbsp; Formato</div>
          <div id=ed></div>
          <div style="background:#f3f3f3;padding:.2em .6em;font-size:.85em;border-top:1px solid #ccc"><span id=wc>Progreso de escritura</span></div></div>`);
   $('#ed').onclick=()=>{ F.ck=1; $('#ed').classList.add('fo'); };
   draw();
 };
 
 S.kd=(e,c)=>{
   if(!F.ty || i>=TX.length) return false;
   
   if(wc){
     if(c==='back'){
       wc=''; ok(); draw(); guiaTeclaParaCaracter(TX[i]);
       say('¡Bien! Corregiste el error. Continuá escribiendo.');
       return true;
     } else {
       bad();
       say('¡Atención! La letra roja está mal. Presioná la tecla <b>Borrar</b> (Backspace) para quitarla.');
       return true;
     }
   }
   
   if(c==='back'){
     if(i>0){ i--; draw(); guiaTeclaParaCaracter(TX[i]); }
     return true;
   }
   
   if(e.key.length === 1){
     if(e.key === TX[i]){
       i++; ok(); draw();
       if(i < TX.length){
         guiaTeclaParaCaracter(TX[i]);
       } else {
         $('#kb-wrap').style.display='none';
         setArrow(null);
       }
       return true;
     } else {
       wc = e.key; bad(); draw();
       const objetivo = TX[i];
       if(objetivo !== objetivo.toLowerCase() && e.key.toLowerCase() === objetivo.toLowerCase()){
         say('Esa letra va en <b>mayúscula</b>: mantené <b>Shift</b> mientras presionás la <b>'+objetivo+'</b>. Ahora presioná <b>Borrar</b>.');
       } else {
         say('Esa tecla no es la correcta. Presioná la tecla <b>Borrar</b> (Backspace) para quitarla.');
       }
       return true;
     }
   }
   return false;
 };

 run([

  }),

    arr:bt('#ed'),arrDir:'down',ok:'¡Apareció el cursor! Empecemos a escribir.'
  }),
  {
    t: 'Escribí el texto sobre las letras grises. El teclado virtual lateral te mostrará qué tecla presionar.',
    r: ()=>$('#cur'),
    d: ()=>i>=TX.length,
    p: 0,
    noRing: true,
    arr: ()=>$('#cur'),
    arrDir: 'down',
    o: ()=>{
      F.ty=1;
      $('#ring').style.display='none';
      $('#kb-wrap').style.display='block';
      draw();
      guiaTeclaParaCaracter(TX[i]);
    },
    ok: '¡Felicitaciones! Escribiste todo el texto a la perfección.'
  }
 ],()=>fin(3,'Completaste la práctica de teclado.'))}},

4:{t:'Cómo Seleccionar Texto',i:'✏️',f(){
 stage(`<div class=win style="inset:1.8em 18em 1.8em 2em">

 const sl=()=>getSelection().toString().trim().toLowerCase();
 const ponCaret=(el, alFinal=false)=>{
   el.focus();
   const r=document.createRange();

   const g=getSelection();
   g.removeAllRanges();

 $$('#kl1, #kl2').forEach(el=>{
   el.onkeydown=e=>{
     if(['Backspace','Delete'].includes(e.key) || (e.key.length===1 && !e.ctrlKey && !e.metaKey)) e.preventDefault();
   };
 });

      x:1,
      arr:()=>getCaretRect($('#sp1-start'), false),
      arrDir:'down',

  }),
  st('Presioná <b>Shift + ▶</b> varias veces para seleccionar las primeras letras.',bt('#kl1'),

      p:0,x:1,arr:()=>getCaretRect($('#kl1'),false),arrDir:'down',
      o:()=>{ ponCaret($('#kl1'),false); if(globalKB) globalKB.set({h:['ShiftLeft'],t:'ArrowRight',a:[]}); },
      ok:'¡Excelente! Con Shift y las flechas seleccionás letra por letra.'
  }),
  
  // TECLADO: Ctrl + Shift + Flecha
  N('Para seleccionar <b>palabra por palabra</b>: el cursor está al inicio. Mantené <b>Ctrl + Shift</b> y tocá la flecha <b>▶</b> dos veces.',{
    o:()=>{
      ponCaret($('#kl1'),false);
      if(globalKB) globalKB.set({h:['ControlLeft','ShiftLeft'],t:'ArrowRight',a:[]});
    },
    arr:()=>getCaretRect($('#kl1'),false),
    arrDir:'down'
  }),
  st('Presioná <b>Ctrl + Shift + ▶</b> dos veces para marcar palabra por palabra.',bt('#kl1'),
    ()=>sl().split(/\s+/).length>=2 && $('#kl1').contains(getSelection().anchorNode),{
      p:0,x:1,arr:()=>getCaretRect($('#kl1'),false),arrDir:'down',
      o:()=>{ ponCaret($('#kl1'),false); if(globalKB) globalKB.set({h:['ControlLeft','ShiftLeft'],t:'ArrowRight',a:[]}); },
      ok:'¡Muy bien! Saltaste de palabra en palabra.'
  }),
  
  // TECLADO: Shift + Fn + Fin
  N('En las laptops, las teclas Inicio y Fin están en las flechas. El cursor está al inicio: mantené <b>Shift + Fn</b> y tocá la flecha <b>▶ Fin</b> para marcar hasta el final.',{
    o:()=>{
      ponCaret($('#kl2'),false);
      if(globalKB) globalKB.set({h:['ShiftLeft','Fn'],t:'ArrowRight',a:['End']});

    arr:()=>getCaretRect($('#kl2'),false),

  }),
  st('Mantené <b>Shift + Fn</b> y tocá <b>▶ Fin</b> para seleccionar toda la segunda línea.',bt('#kl2'),

      ok:'¡Perfecto! Seleccionaste hasta el final del renglón con Shift + Fn + Fin.'
  }),
  
  // TECLADO: Shift + Fn + Inicio
  N('Ahora el cursor está al final de la línea (donde apunta la flecha). Mantené <b>Shift + Fn</b> y tocá la flecha <b>◀ Inicio</b> para marcar hacia el principio.',{
    o:()=>{
      ponCaret($('#kl2'),true);
      if(globalKB) globalKB.set({h:['ShiftLeft','Fn'],t:'ArrowLeft',a:['Home']});
    },

    arrDir:'down'
  }),
  st('Mantené <b>Shift + Fn</b> y tocá <b>◀ Inicio</b> para marcar hacia el principio.',bt('#kl2'),
    ()=>sl().includes('el software son las aplicaciones'),{
      p:0,x:1,arr:()=>getCaretRect($('#kl2'),true),arrDir:'down',
      o:()=>{ ponCaret($('#kl2'),true); if(globalKB) globalKB.set({h:['ShiftLeft','Fn'],t:'ArrowLeft',a:['Home']}); },
      ok:'¡Extraordinario! Aprendiste a seleccionar con mouse y teclado.'
  })
 ],()=>fin(4,'Dominaste todas las técnicas de selección.'))}},

/* 5. VENTANAS Y BOTONES */
5:{t:'Ventanas y Botones',i:'🪟',f(){
 let mn=0, cl=0;
 const w=()=>$('#np'), mx=()=>!!w()&&w().classList.contains('max');
 F.np=()=>{
   if(w())return;
   stage(`<div class=win id=np style="left:6em;top:3em;width:33em;height:20em">
            <div class=tt id=wtt>📝 Sin título - Bloc de notas
              <b>
                <button class=wb id=bmin title=Minimizar>—</button>
                <button class=wb id=bmax title=Maximizar>☐</button>
                <button class="wb x" id=bcl title=Cerrar>✕</button>
              </b>
            </div>
            <textarea style="flex:1;border:0;padding:.5em;font:inherit">¡Esta es una ventana! Aprendé a usar los tres botones de control arriba a la derecha.</textarea>
          </div>`);
   $('#bmax').onclick=()=>{ w().classList.toggle('max'); $('#bmax').textContent=mx()?'❐':'☐'; };
   $('#bmin').onclick=()=>{
     w().style.display='none'; mn=1;
     const b=document.createElement('button');
     b.className='tk blink'; b.id='tbn'; b.textContent='📝 Bloc de notas';
     b.onclick=()=>{ w().style.display=''; b.remove(); mn=0; };
     $('#tasks').append(b);
   };
   $('#bcl').onclick=()=>{ w().remove(); cl=1; };
 };

 run([
  st('Hacé clic en <b>Inicio</b> para comenzar.',bt('#st'),()=>$('#sm').style.display=='block',{
    arr:bt('#st'),arrDir:'down'
  }),
  st('Abrí el <b>Bloc de notas</b>.',bt('#sn'),()=>w(),{
    arr:bt('#sn'),arrDir:'down',ok:'¡Se abrió la ventana!'
  }),
  N('Todo esto es una <b>ventana</b>. Arriba a la derecha tiene tres botones principales.',{
    o:hl('#np'), arr:bt('#wtt'), arrDir:'down'
  }),
  st('El botón <b>Maximizar</b> (el cuadrado) agranda la ventana a toda la pantalla. Hacé clic en él.',bt('#bmax'),mx,{
    arr:bt('#bmax'),arrDir:'down',ok:'¡La ventana ahora ocupa toda la pantalla!'
  }),
  st('Ahora ese botón se llama <b>Restaurar</b>. Hacé clic para volver al tamaño anterior.',bt('#bmax'),()=>!mx(),{
    arr:bt('#bmax'),arrDir:'down',ok:'¡Volvió a su tamaño normal!'
  }),
  st('El botón <b>Minimizar</b> (la rayita) guarda la ventana en la barra de tareas. Probalo.',bt('#bmin'),()=>mn,{
    arr:bt('#bmin'),arrDir:'down',ok:'¡Muy bien! Se ocultó abajo.'
  }),
  st('Hacé clic en el botón parpadeante de la <b>barra de tareas</b> para reabrirla.',bt('#tbn'),()=>!mn,{
    arr:bt('#tbn'),arrDir:'down',ok:'¡De vuelta en pantalla!'
  }),
  st('Por último, hacé clic en la <b>X roja</b> para <b>Cerrar</b> el programa.',bt('#bcl'),()=>cl,{
    arr:bt('#bcl'),arrDir:'down',ok:'¡Ventana cerrada correctamente!'
  })
 ],()=>fin(5,'Aprendiste a controlar las ventanas.'))}},

/* 6. APAGADO SEGURO */
6:{t:'Apagado Seguro',i:PW,f(){
 F.a6=1;
 run([
  st('Para apagar la computadora, hacé clic en <b>Inicio</b>.',bt('#st'),()=>$('#sm').style.display=='block',{
    arr:bt('#st'),arrDir:'down'
  }),
  st('Ahora hacé clic en el botón de <b>Energía</b>.',bt('#pw'),()=>$('#pp').style.display=='block',{
    arr:bt('#pw'),arrDir:'down'
  }),
  st('Por último, elegí <b>Apagar</b>.',bt('#off'),()=>0,{
    arr:bt('#off'),arrDir:'down'
  })
 ],()=>{})}}
};

const BL=[['🖱️ Primeros pasos',1,2],['⌨️ Teclado y texto',3,4],['🪟 Ventanas',5,5],[PW+' Cierre',6,6]];
</script>
