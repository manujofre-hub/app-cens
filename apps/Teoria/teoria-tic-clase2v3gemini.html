/* ===== INICIO MÓDULO ALUMNO v1.1 ===== */
const MJ_INDEX='../../index.html';
const Alumno=(()=>{
 const mem={},ls=(()=>{try{localStorage.setItem('mj:t',1);localStorage.removeItem('mj:t');return localStorage}catch(e){return null}})();
 const leer=k=>{try{const v=ls?ls.getItem('mj:'+k):mem[k];return v==null?null:JSON.parse(v)}catch(e){return null}};
 const guardar=(k,v)=>{try{const s=JSON.stringify(v);if(ls)ls.setItem('mj:'+k,s);else mem[k]=s;return true}catch(e){return false}};
 const borrar=k=>{try{if(ls)ls.removeItem('mj:'+k);else delete mem[k]}catch(e){}};
 const limpio=s=>String(s==null?'':s).replace(/[<>&"'`\\\/]/g,'').replace(/\s+/g,' ').trim().slice(0,40);
 const slug=s=>limpio(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');
 const get=()=>{const a=leer('alumno');return a&&a.id?a:null};
 const set=d=>{d=d||{};const nombre=limpio(d.nombre),curso=limpio(d.curso);if(nombre.length<2)return null;
  const a={nombre,curso,id:slug(nombre)+(curso?'_'+slug(curso):''),creado:new Date().toISOString()};guardar('alumno',a);return a};
 const DEF={fs:16,voz:true,snd:true,kbDark:false};
 const prefs=()=>{const p=leer('prefs')||{},o={};for(const k in DEF)o[k]=k in p?p[k]:DEF[k];return o};
 const setPref=(k,v)=>{if(!(k in DEF))return;const p=prefs();p[k]=v;guardar('prefs',p)};
 const irInicio=()=>{location.href=MJ_INDEX};
 const botonInicio=el=>{const b=document.createElement('button');b.textContent='🏠 Inicio';b.title='Volver al inicio';b.onclick=irInicio;
  b.style.cssText=el?'background:#374151;color:#fff;border:0;border-radius:.3em;padding:.15em .6em;cursor:pointer;font:inherit'
   :'position:fixed;top:.4em;right:.4em;z-index:9998;background:#374151;color:#fff;border:0;border-radius:.4em;padding:.3em .7em;cursor:pointer;font:inherit';
  if(el)el.insertBefore(b,el.firstChild);else document.body.appendChild(b);return b};
 function pedir(cb){const a=get();if(a){cb(a);return}
  const d=document.createElement('div'),ci='font:inherit;font-size:1.2em;padding:.4em;border-radius:.4em;border:0;text-align:center;width:min(20em,90%);color:#222';
  d.style.cssText='position:fixed;top:0;left:0;right:0;bottom:0;z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:1em;text-align:center;color:#fff;font:18px "Segoe UI",Arial,sans-serif;background:linear-gradient(135deg,#0a5fc0,#06336b)';
  d.innerHTML='<h1 style="font-size:1.6em;margin:0 0 .4em">👋 ¡Bienvenido!</h1><p style="margin:.3em">Escribe tu nombre y apellido:</p>'+
   '<input id=mjn maxlength=40 autocomplete=off style="'+ci+'"><p id=mje style="min-height:1.6em;margin:.5em;color:#fde68a;font-weight:700"></p>'+
   '<button id=mjb style="font:inherit;font-size:1.2em;padding:.5em 1.4em;border:0;border-radius:.5em;background:#22c55e;color:#fff;cursor:pointer">Ingresar</button>';
  document.body.appendChild(d);
  const n=d.querySelector('#mjn'),e=d.querySelector('#mje');
  const go=()=>{const x=set({nombre:n.value});if(!x){e.textContent='Escribe tu nombre y apellido.';n.focus();return}d.remove();cb(x)};
  ['keydown','keyup'].forEach(t=>d.addEventListener(t,ev=>{ev.stopPropagation();if(t=='keydown'&&ev.key=='Enter')go()}));
  d.querySelector('#mjb').onclick=go;n.focus()}
 return{get,set,nombre:()=>{const a=get();return a?a.nombre:''},limpiar:()=>borrar('alumno'),pedir,prefs,setPref,irInicio,botonInicio,
  almacen:{leer,guardar,borrar},limpio,slug}})();
/* ===== FIN MÓDULO ALUMNO v1.1 ===== */

/* ===== INICIO MÓDULO PROGRESO v1 ===== */
const Progreso=(()=>{
 const AL=Alumno.almacen,uid=()=>{const a=Alumno.get();return a?a.id:'anonimo'},K=()=>'progreso:'+uid(),KE=()=>'enviado:'+uid();
 const todo=()=>{const d=AL.leer(K());return d&&d.v==1&&d.act&&typeof d.act=='object'?d:{v:1,act:{}}};
 const reg=(app,act,d)=>{d=d||{};const p=todo(),key=app+'/'+act,o=p.act[key]||{},fin=d.estado=='hecha';
  p.act[key]={estado:fin||o.estado=='hecha'?'hecha':'en-curso',
   estrellas:Math.max(o.estrellas||0,Math.min(3,Math.max(0,Math.round(+d.estrellas||0)))),
   errores:d.errores!=null?Math.max(0,Math.round(+d.errores||0)):(o.errores||0),
   seg:d.seg!=null?Math.max(0,Math.round(+d.seg||0)):(o.seg||0),
   veces:(o.veces||0)+(fin?1:0),fecha:new Date().toISOString(),mod:Date.now()};
  AL.guardar(K(),p);return p.act[key]};
 const get=app=>{const p=todo().act,r={};for(const key in p)if(!app||key.indexOf(app+'/')==0)r[app?key.slice(app.length+1):key]=p[key];return r};
 const hecha=(app,act)=>{const o=todo().act[app+'/'+act];return !!o&&o.estado=='hecha'};
 const resumen=(app,total)=>{const g=get(app),ids=Object.keys(g).filter(x=>g[x].estado=='hecha'),hechas=ids.length;
  return{hechas,total:total||hechas,pct:total?Math.min(100,Math.round(hechas/total*100)):0,estrellas:ids.reduce((n,x)=>n+(g[x].estrellas||0),0)}};
 const pendientes=()=>{const env=AL.leer(KE())||0,p=todo().act,l=[];
  for(const key in p)if((p[key].mod||0)>env){const i=key.indexOf('/');l.push(Object.assign({app:key.slice(0,i),act:key.slice(i+1)},p[key]))}return l};
 const marcarEnviado=l=>{if(!l||!l.length)return;AL.guardar(KE(),Math.max.apply(null,l.map(x=>x.mod||0)))};
 const exportar=()=>JSON.stringify({v:1,alumno:Alumno.get(),act:todo().act,fecha:new Date().toISOString()});
 const importar=t=>{let d;try{d=JSON.parse(t)}catch(e){return -1}
  if(!d||d.v!=1||!d.act||typeof d.act!='object')return -1;
  if(!Alumno.get()&&d.alumno&&d.alumno.nombre)Alumno.set({nombre:d.alumno.nombre,curso:d.alumno.curso});
  const a=Alumno.get();if(d.alumno&&a&&d.alumno.id&&d.alumno.id!=a.id)return -2;
  const p=todo();let n=0;for(const key in d.act){const x=d.act[key],o=p.act[key];if(x&&x.estado&&(!o||(x.mod||0)>(o.mod||0))){p.act[key]=x;n++}}
  AL.guardar(K(),p);return n};
 const borrar=app=>{if(!app){AL.borrar(K());AL.borrar(KE());return}const p=todo();for(const key in p.act)if(key.indexOf(app+'/')==0)delete p.act[key];AL.guardar(K(),p)};
 return{registrar:reg,get,hecha,resumen,pendientes,marcarEnviado,exportar,importar,borrar}})();
/* ===== FIN MÓDULO PROGRESO v1 ===== */

const Motor=(()=>{

function actTeclado(m){
 const tests=[
  {t:'Espacio',k:'Space',msg:'Presioná la Barra Espaciadora'},
  {t:'Enter',k:'Enter',msg:'Presioná la tecla Enter (Intro)'},
  {t:'Flecha derecha',k:'ArrowRight',msg:'Tocá la flecha hacia la derecha (▶)'},
  {t:'Escape',k:'Escape',msg:'Presioná la tecla Esc (Escape, arriba a la izquierda)'}
 ];
 let curT=0;
 function sh(){
  if(curT>=tests.length){ m.fin({res:'¡Excelente! Dominás las teclas principales del teclado.'}); return; }
  const obj=tests[curT];
  m.pg('Misión de teclado: '+obj.t+' ('+(curT+1)+'/'+tests.length+')');
  m.el.innerHTML=`<div class=mo-pr><h2>Misión de teclado</h2><p>Encontrá la tecla en tu teclado real y presionala:</p>
    <div class=pad2 style="font-size:1.6em;margin:1.5em auto;border-color:#38bdf8"><b style="color:#facc15">${obj.msg}</b></div>
    <p style="color:#9ec5ff">Presioná la tecla solicitada...</p></div>`;
  m.bot('Mirá tu teclado y presioná la tecla: '+obj.t);
  m.obj(()=>m.el.querySelector('.pad2'));
  const h=(e)=>{
    if(e.code===obj.k || e.key===obj.k){
      window.removeEventListener('keydown',h);
      m.bot('✅ ¡Tecla '+obj.t+' detectada!');
      curT++; setTimeout(sh,1200);
    } else {
      m.err();
      m.bot('Esa fue la tecla "'+e.key+'". Buscá la tecla '+obj.t+'.');
    }
  };
  window.addEventListener('keydown',h);
 }
 sh();
}

function actAlmacen(m){
 const items=[
  {n:'Pendrive',d:'Memoria flash de bolsillo (16 a 64 GB)',img:'c2-pendrive-01',uso:'Llevar tareas escolares de casa a la escuela'},
  {n:'Disco externo',d:'Gran capacidad de almacenamiento (1 a 2 TB)',img:'c2-discoext-01',uso:'Hacer copias de seguridad (backup) de miles de fotos familiares'},
  {n:'Tarjeta MicroSD',d:'Memoria diminuta para celulares y cámaras',img:'c2-sd-01',uso:'Expandir la memoria de fotos en tu teléfono celular'}
 ];
 let idx=0;
 function ver(){
  if(idx>=items.length){ m.fin({res:'¡Excelente! Conocés todos los formatos de almacenamiento externo.'}); return; }
  const it=items[idx];
  m.pg('Almacenamiento: '+it.n+' ('+(idx+1)+'/'+items.length+')');
  m.el.innerHTML=`<div class=mo-pr><h2>¿Cuál es el mejor uso para este dispositivo?</h2>
    <div class="vcard" style="margin:1em auto;cursor:default">
      <img src="${MJ_IMG+it.img}.webp" alt="${it.n}" onerror="this.style.display='none'">
      <b>${it.n}</b>
      <small>${it.d}</small>
    </div>
    <div class="mo-ops" style="max-width:32em;margin:auto">
      ${items.map((x,i)=>`<button class=btn data-u="${i}" style="margin:.3em 0">${x.uso}</button>`).join('')}
    </div></div>`;
  m.bot('Mirá la foto de este dispositivo de almacenamiento y elegí para qué conviene usarlo.');
  m.obj(()=>m.el.querySelector('.vcard'));
  m.el.onclick=e=>{
    const b=e.target.closest('[data-u]');if(!b)return;
    if(+b.dataset.u===idx){ m.bot('✅ ¡Correcto! Ese es el uso ideal para ' + it.n + '.'); idx++; setTimeout(ver,1400); }
    else{ m.err(); m.bot('¡Casi! Pensá en el tamaño y la capacidad de este dispositivo.'); }
  };
 }
 ver();
}
